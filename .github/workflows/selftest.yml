name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: test Picchio
        run: python picchio.py --selftest
      - name: test the single file
        run: python public/picchio.pyz --selftest
      - name: test instant workbench verification
        if: matrix.python == '3.13'
        run: python -m unittest discover -s workbench/runner/tests -v
      - name: replay captured workbench receipts
        if: matrix.python == '3.13'
        run: python workbench/receipts/replay_workbench_receipts.py
