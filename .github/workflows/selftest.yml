name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: test Picchio
        run: python picchio.py --selftest
      - name: test the single file
        run: python public/picchio.pyz --selftest
