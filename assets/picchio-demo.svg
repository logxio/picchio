<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="430" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>

  <g visibility="visible">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="visible;hidden;visible" keyTimes="0;.32;1"/>
    <text x="28" y="72" fill="#e6edf3" font-size="14">$ curl http://127.0.0.1:8080/v1/chat/completions</text>
    <rect x="28" y="100" width="337" height="250" rx="8" fill="#101820" stroke="#30363d"/>
    <text x="50" y="140" fill="#8b949e" font-size="13">LOCAL LLM SERVER</text>
    <text x="50" y="188" fill="#3fb950" font-size="21" font-weight="700">HTTP 200 OK</text>
    <text x="50" y="230" fill="#e6edf3" font-size="14">response: "Hello"</text>
    <text x="50" y="270" fill="#8b949e" font-size="13">request completed</text>

    <rect x="395" y="100" width="337" height="250" rx="8" fill="#1a1214" stroke="#da3633" stroke-width="2"/>
    <text x="417" y="140" fill="#f85149" font-size="13" font-weight="700">PICCHIO</text>
    <text x="417" y="184" fill="#f85149" font-size="21" font-weight="700">CPU FALLBACK</text>
    <text x="417" y="230" fill="#e6edf3" font-size="17" font-weight="700">0/33 layers on GPU</text>
    <text x="417" y="272" fill="#f85149" font-size="17" font-weight="700">26.8 tok/s</text>
    <text x="28" y="395" fill="#e6edf3" font-size="17" font-weight="700">The request worked.</text>
    <text x="236" y="395" fill="#f85149" font-size="17" font-weight="700">The GPU did not.</text>
  </g>

  <g visibility="hidden">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0;.32;.65;1"/>
    <text x="28" y="72" fill="#f85149" font-size="20" font-weight="700">CPU FALLBACK — CONFIRMED</text>
    <rect x="28" y="104" width="704" height="246" rx="8" fill="#101820"/>
    <text x="52" y="142" fill="#8b949e" font-size="13">ENGINE</text>
    <text x="210" y="142" fill="#e6edf3" font-size="15">offloaded 0/33 layers to GPU</text>
    <text x="52" y="182" fill="#8b949e" font-size="13">OS</text>
    <text x="210" y="182" fill="#e6edf3" font-size="15">GPU work 0% · memory +0.3 GiB</text>
    <text x="52" y="230" fill="#3fb950" font-size="13">HEALTHY</text>
    <text x="210" y="230" fill="#e6edf3" font-size="15">33/33 layers on GPU · 588.0 tok/s</text>
    <text x="52" y="278" fill="#f85149" font-size="13">CAUGHT</text>
    <text x="210" y="278" fill="#f85149" font-size="15" font-weight="700">0/33 · 26.8 tok/s · 21.9× slower</text>
    <text x="28" y="395" fill="#f85149" font-size="16" font-weight="700">SUSPECT: placement.</text>
  </g>

  <g visibility="hidden">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="hidden;visible;hidden" keyTimes="0;.65;1"/>
    <text x="28" y="72" fill="#3fb950" font-size="20" font-weight="700">RUN PICCHIO</text>
    <rect x="28" y="104" width="704" height="246" rx="8" fill="#101820"/>
    <text x="52" y="158" fill="#e6edf3" font-size="14">$ curl -fsSL https://raw.githubusercontent.com/logxio/</text>
    <text x="68" y="188" fill="#e6edf3" font-size="14">picchio/main/public/picchio.pyz -o picchio</text>
    <text x="52" y="236" fill="#e6edf3" font-size="14">$ chmod +x picchio</text>
    <text x="52" y="284" fill="#3fb950" font-size="18" font-weight="700">$ ./picchio MODEL</text>
  </g>
</svg>
