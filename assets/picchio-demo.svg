<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="430" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>

  <g visibility="visible">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="visible;hidden;visible" keyTimes="0;.32;1"/>
    <text x="28" y="72" fill="#e6edf3" font-size="14">$ Qwen3.8-27B on RTX 4070 SUPER 12 GB</text>
    <rect x="28" y="100" width="337" height="250" rx="8" fill="#101820" stroke="#30363d"/>
    <text x="50" y="140" fill="#8b949e" font-size="13">LLAMA.CPP</text>
    <text x="50" y="188" fill="#3fb950" font-size="21" font-weight="700">RUN COMPLETED</text>
    <text x="50" y="230" fill="#e6edf3" font-size="14">generated text</text>
    <text x="50" y="270" fill="#8b949e" font-size="13">no error returned</text>

    <rect x="395" y="100" width="337" height="250" rx="8" fill="#1a1214" stroke="#da3633" stroke-width="2"/>
    <text x="417" y="140" fill="#f85149" font-size="13" font-weight="700">PICCHIO</text>
    <text x="417" y="184" fill="#f85149" font-size="19" font-weight="700">PARTIAL OFFLOAD</text>
    <text x="417" y="238" fill="#f85149" font-size="17" font-weight="700">28 of 66 layers on CPU</text>
    <text x="28" y="395" fill="#f85149" font-size="17" font-weight="700">Decode ran 14.3× slower.</text>
  </g>

  <g visibility="hidden">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0;.32;.65;1"/>
    <text x="28" y="72" fill="#f85149" font-size="20" font-weight="700">SAME 27B FILE. TWO CARDS.</text>
    <rect x="28" y="104" width="704" height="246" rx="8" fill="#101820"/>
    <text x="52" y="170" fill="#3fb950" font-size="13">RTX 5090</text>
    <text x="210" y="170" fill="#e6edf3" font-size="17">32 GB · 66/66 GPU · 81.5 tok/s</text>
    <text x="52" y="244" fill="#f85149" font-size="13">RTX 4070S</text>
    <text x="210" y="244" fill="#f85149" font-size="17" font-weight="700">12 GB · 38/66 GPU · 5.7 tok/s</text>
    <text x="52" y="316" fill="#8b949e" font-size="13">Q4_K_M GGUF · llama.cpp · ctx 4096 · 1 request · decode</text>
  </g>

  <g visibility="hidden">
    <animate attributeName="visibility" dur="12s" repeatCount="indefinite" calcMode="discrete" values="hidden;visible;hidden" keyTimes="0;.65;1"/>
    <text x="28" y="72" fill="#3fb950" font-size="20" font-weight="700">RUN PICCHIO</text>
    <rect x="28" y="104" width="704" height="246" rx="8" fill="#101820"/>
    <text x="52" y="158" fill="#e6edf3" font-size="14">$ curl -fsSL https://raw.githubusercontent.com/logxio/</text>
    <text x="68" y="188" fill="#e6edf3" font-size="14">picchio/main/public/picchio.pyz -o picchio</text>
    <text x="52" y="236" fill="#e6edf3" font-size="14">$ chmod +x picchio</text>
    <text x="52" y="284" fill="#3fb950" font-size="18" font-weight="700">$ ./picchio MODEL</text>
  </g>
</svg>
